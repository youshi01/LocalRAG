services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: localrag-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      LOCALRAG_QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LOCALRAG_QDRANT_BIND_ADDRESS: ${QDRANT_BIND_ADDRESS:-127.0.0.1}
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$LOCALRAG_QDRANT_BIND_ADDRESS" in
          127.0.0.1|::1|localhost) ;;
          *)
            if [ -z "$$LOCALRAG_QDRANT_API_KEY" ]; then
              echo "QDRANT_API_KEY must be set when QDRANT_BIND_ADDRESS is not loopback" >&2
              exit 1
            fi
            ;;
        esac
        if [ -n "$$LOCALRAG_QDRANT_API_KEY" ]; then
          export QDRANT__SERVICE__API_KEY="$$LOCALRAG_QDRANT_API_KEY"
        fi
        exec ./entrypoint.sh
    volumes:
      - ${QDRANT_STORAGE_PATH:-./qdrant_storage}:/qdrant/storage
